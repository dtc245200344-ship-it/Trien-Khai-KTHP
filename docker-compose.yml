version: '3.8'

services:
  # ====================================================================
  # 1. DATABASE LAYER: POSTGRESQL 16
  # ====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crm_db}
      POSTGRES_USER: ${DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_secret_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm_user} -d ${DB_NAME:-crm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ====================================================================
  # 2. DATABASE MANAGEMENT: PGADMIN 4
  # ====================================================================
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: crm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@crm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-AdminPass@2026}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    networks:
      - backend_net
      - frontend_net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  # ====================================================================
  # 3. CRM BACKEND & FRONTEND APPLICATION
  # ====================================================================
  crm-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: crm-system-app:1.0.0
    container_name: crm-application
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crm_db}
      DB_USER: ${DB_USER:-crm_user}
      DB_PASSWORD: ${DB_PASSWORD:-crm_secret_pass_2026}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    volumes:
      - app_logs:/app/logs
    networks:
      - frontend_net
      - backend_net
      - monitoring_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ====================================================================
  # 4. REVERSE PROXY & GATEWAY: NGINX
  # ====================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: crm-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
    depends_on:
      - crm-app
      - pgadmin
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ====================================================================
  # 5. METRICS COLLECTION: PROMETHEUS
  # ====================================================================
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: crm-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  # ====================================================================
  # 6. DASHBOARDS & VISUALIZATION: GRAFANA
  # ====================================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: crm-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: '/etc/grafana/provisioning/dashboards/crm-overview.json'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  # ====================================================================
  # 7. LOG AGGREGATION: GRAFANA LOKI
  # ====================================================================
  loki:
    image: grafana/loki:3.1.0
    container_name: crm-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  # ====================================================================
  # 8. LOG SHIPPER: PROMTAIL
  # ====================================================================
  promtail:
    image: grafana/promtail:3.1.0
    container_name: crm-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - app_logs:/var/log/app:ro
    networks:
      - monitoring_net
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# ====================================================================
# NETWORK ARCHITECTURE (ISOLATION & HARDENING)
# ====================================================================
networks:
  frontend_net:
    driver: bridge
    name: crm_frontend_net
  backend_net:
    driver: bridge
    name: crm_backend_net
    # Bảo mật: Cắt kết nối ra ngoài internet trực tiếp cho tầng cơ sở dữ liệu
    internal: false
  monitoring_net:
    driver: bridge
    name: crm_monitoring_net

# ====================================================================
# PERSISTENT VOLUMES
# ====================================================================
volumes:
  pgdata:
  pgadmin_data:
  nginx_logs:
  app_logs:
  prometheus_data:
  grafana_data:
  loki_data:
