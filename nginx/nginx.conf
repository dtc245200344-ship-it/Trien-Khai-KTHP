user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ====================================================================
    # HARDENING & SECURITY DIRECTIVES
    # ====================================================================
    # 1. Ẩn thông tin phiên bản Nginx chống dò quét lỗ hổng
    server_tokens off;

    # 2. Giới hạn kích thước buffer chống tràn bộ đệm (Buffer Overflow Attacks)
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    client_max_body_size 16M;
    large_client_header_buffers 4 8k;

    # 3. Timeout ngăn chặn tấn công Slowloris DoS
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # 4. Định dạng Log dạng JSON chuẩn cho Promtail & Grafana Loki (LogQL)
    log_format json_analytics escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status"'
    '}';

    access_log  /var/log/nginx/access.log  json_analytics;

    # Tối ưu hóa truyền tải dữ liệu
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Bật nén Gzip tối ưu băng thông
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Giới hạn tần suất request (Rate Limiting) chống spam và DDoS
    limit_req_zone $binary_remote_addr zone=crm_limit:10m rate=30r/s;
    limit_req_status 429;

    # Bao gồm các file cấu hình virtual hosts
    include /etc/nginx/conf.d/*.conf;
}

