upstream crm_backend {
    server crm-app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream pgadmin_backend {
    server pgadmin:80;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # ====================================================================
    # SECURITY HEADERS (HARDENING HTTP LAYER)
    # ====================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Tắt logging cho favicon và robots.txt
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # ====================================================================
    # REVERSE PROXY ĐẾN CRM APPLICATION
    # ====================================================================
    location / {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Giới hạn tần suất request riêng cho API
    location /api/ {
        limit_req zone=crm_limit burst=20 nodelay;

        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint kiểm tra sức khỏe
    location /health {
        proxy_pass http://crm_backend/health;
        access_log off;
    }

    # Endpoint metrics cho Prometheus
    location /metrics {
        proxy_pass http://crm_backend/metrics;
        # Có thể giới hạn IP nếu cần bảo mật
    }

    # ====================================================================
    # REVERSE PROXY ĐẾN PGADMIN 4
    # ====================================================================
    location /pgadmin/ {
        proxy_pass http://pgadmin_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
    }
}

