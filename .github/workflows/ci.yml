name: CRM System CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 1. Kiểm tra mã nguồn & Chạy unit test
  test:
    name: Unit Test & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package.json'

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Run automated tests
        working-directory: ./app
        run: npm test

  # 2. Kiểm thử cấu hình Docker Compose
  validate-compose:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Validate docker-compose file syntax
        run: docker compose config

  # 3. Build & Quét lỗ hổng bảo mật Docker image (Security Hardening Scan)
  security-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test, validate-compose]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CRM Application Docker Image
        run: docker build -t crm-system-app:latest ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'crm-system-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
