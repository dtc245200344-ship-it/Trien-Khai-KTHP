server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Thu thập Nginx Access & Error Logs
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx-reverse-proxy
          __path__: /var/log/nginx/*log
    pipeline_stages:
      - json:
          expressions:
            remote_addr: remote_addr
            request_method: request_method
            request_uri: request_uri
            status: status
            request_time: request_time
      - labels:
          request_method:
          status:

  # 2. Thu thập Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: crm-app
          service: crm-backend
          __path__: /var/log/app/*log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            duration_ms: duration_ms
      - labels:
          level:
          service:
