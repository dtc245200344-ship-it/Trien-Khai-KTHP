global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'crm-monitoring-system'

scrape_configs:
  # 1. Thu thập metrics từ ứng dụng CRM
  - job_name: 'crm-app'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['crm-app:3000']
        labels:
          group: 'application'
          service: 'crm-service'

  # 2. Thu thập metrics từ chính Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          group: 'monitoring'

  # 3. Thu thập metrics từ Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          group: 'logging'

